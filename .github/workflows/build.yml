# =============================================================================
# CI — compila este repositório contra o workspace pinado, nos dois distros.
# =============================================================================
#
# Por que existe: sem CI, "a main compila" é uma crença, não um fato. E o time
# voa com DUAS distros ao mesmo tempo — Jetson (Humble) e Raspberry Pi (Jazzy),
# às vezes na mesma competição. Uma biblioteca compartilhada que vira
# Humble-only não dá nenhum sinal até alguém tentar usá-la na outra máquina,
# normalmente no pior momento possível.
#
# As versões das dependências vêm do `evtol.repos` do evtol-dev, não de uma
# lista aqui. Assim o CI responde à pergunta certa: "este repositório funciona
# com o workspace que o time realmente usa?" — e um pin bumpado lá que quebre
# aqui aparece como falha aqui.
# =============================================================================

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Sem variável de pacote: os pacotes deste repositório são descobertos com
# `colcon list`. Assim o mesmo arquivo serve a repositórios de um pacote só
# (drone_lib, stdstates) e a repositórios com vários (fsm, cv_nodes).

jobs:
  build:
    name: build (${{ matrix.distro }})
    runs-on: ubuntu-latest
    container: ros:${{ matrix.distro }}-ros-base

    strategy:
      fail-fast: false
      matrix:
        # Os dois são obrigatórios. O primeiro run do CI comprovou que a stack
        # (px4_msgs + custom_msgs + drone_lib) compila em Jazzy — era a maior
        # incógnita do workspace, já que o time voa com Jetson (Humble) e
        # Raspberry Pi (Jazzy) na mesma competição.
        distro:
          - humble   # Jetson Orin Nano + máquina de desenvolvimento
          - jazzy    # Raspberry Pi

    steps:
      - name: Instalar ferramentas
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates python3-vcstool python3-colcon-common-extensions python3-yaml

      - name: Clonar este repositório em src/
        uses: actions/checkout@v4
        with:
          path: src/${{ github.event.repository.name }}

      - name: Buscar o manifesto do workspace
        run: |
          curl -fsSL -o evtol.repos \
            https://raw.githubusercontent.com/Equipe-eVTOL-ITA/evtol-dev/main/evtol.repos

      - name: Importar dependências nas versões pinadas
        run: |
          # Remove a própria entrada: este repositório vem do checkout acima,
          # na revisão do PR — não da tag pinada.
          python3 - <<'PY'
          import yaml
          m = yaml.safe_load(open("evtol.repos"))
          m["repositories"].pop("${{ github.event.repository.name }}", None)
          yaml.safe_dump(m, open("deps.repos", "w"))
          PY
          vcs import --shallow src < deps.repos

      - name: rosdep
        run: |
          rosdep update --rosdistro ${{ matrix.distro }}
          rosdep install --from-paths src --ignore-src -y \
            --rosdistro ${{ matrix.distro }} || \
            echo "::warning::rosdep reportou erros; seguindo para o build"

      - name: Compilar
        shell: bash
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          pkgs=$(colcon list --names-only --base-paths "src/${{ github.event.repository.name }}" | tr '\n' ' ')
          echo "Pacotes deste repositório: $pkgs"
          [ -n "$pkgs" ] || { echo "::error::nenhum pacote colcon encontrado"; exit 1; }
          colcon build --packages-up-to $pkgs \
            --event-handlers console_direct+ \
            --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo

  # ---------------------------------------------------------------------------
  # Lint — informativo, não bloqueia.
  #
  # O `colcon test` deste pacote hoje roda apenas os linters do ament
  # (cppcheck, lint_cmake, uncrustify, xmllint); não há teste unitário. Os dois
  # de estilo reprovam num codigo que nunca teve lint. Ligar isso como
  # obrigatorio de uma vez produziria uma parede de ruido e ensinaria o time a
  # ignorar o CI.
  #
  # Fica visivel e nao bloqueante. Quando o estilo for acertado num PR proprio,
  # remova o continue-on-error.
  # ---------------------------------------------------------------------------
  lint:
    name: lint (informativo)
    runs-on: ubuntu-latest
    container: ros:humble-ros-base
    continue-on-error: true

    steps:
      - name: Instalar ferramentas
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates python3-vcstool \
            python3-colcon-common-extensions python3-yaml

      - name: Clonar este repositório em src/
        uses: actions/checkout@v4
        with:
          path: src/${{ github.event.repository.name }}

      - name: Buscar o manifesto do workspace
        run: |
          curl -fsSL -o evtol.repos \
            https://raw.githubusercontent.com/Equipe-eVTOL-ITA/evtol-dev/main/evtol.repos

      - name: Importar dependências nas versões pinadas
        run: |
          python3 - <<'PY'
          import yaml
          m = yaml.safe_load(open("evtol.repos"))
          m["repositories"].pop("${{ github.event.repository.name }}", None)
          yaml.safe_dump(m, open("deps.repos", "w"))
          PY
          vcs import --shallow src < deps.repos

      - name: rosdep
        run: |
          rosdep update --rosdistro humble
          rosdep install --from-paths src --ignore-src -y --rosdistro humble || true

      - name: Compilar e rodar linters
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          pkgs=$(colcon list --names-only --base-paths "src/${{ github.event.repository.name }}" | tr '\n' ' ')
          colcon build --packages-up-to $pkgs
          colcon test --packages-select $pkgs
          colcon test-result --verbose
